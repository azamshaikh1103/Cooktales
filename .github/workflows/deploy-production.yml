name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to deploy. Use main unless you have a specific approved commit.
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CookTale
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Confirm this commit is on main
        id: release
        run: |
          set -eu
          commit="$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor "$commit" origin/main
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Confirm CI passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -eu
          conclusion="$(gh run list --workflow ci.yml --commit "$COMMIT" --limit 20 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          test "$conclusion" -gt 0

      - name: Configure AWS access through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Start safe server deployment through SSM
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
          INSTANCE_ID: ${{ secrets.AWS_PRODUCTION_INSTANCE_ID }}
        run: |
          set -eu
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CookTale production deployment $COMMIT" \
            --parameters "commands=[\"set -eu; sudo -u ec2-user git -C /home/ec2-user/cooktale diff --quiet; sudo -u ec2-user git -C /home/ec2-user/cooktale diff --cached --quiet; sudo -u ec2-user git -C /home/ec2-user/cooktale fetch --prune origin main; sudo -u ec2-user git -C /home/ec2-user/cooktale cat-file -e $COMMIT^{commit}; sudo -u ec2-user git -C /home/ec2-user/cooktale merge-base --is-ancestor $COMMIT origin/main; sudo -u ec2-user git -C /home/ec2-user/cooktale show $COMMIT:deploy/deploy-production.sh | sh -s -- $COMMIT\"]" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) \
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json
                exit 1 ;;
            esac
            echo "Waiting for the server deployment (attempt $attempt/60)..."
            sleep 10
          done

          echo "Deployment did not finish within 10 minutes. Check AWS Systems Manager."
          exit 1
