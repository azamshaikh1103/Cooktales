name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to deploy. Use main unless you have a specific approved commit.
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CookTale
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Confirm this commit is on main
        id: release
        run: |
          set -eu
          commit="$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor "$commit" origin/main
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Confirm CI passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -eu
          conclusion="$(gh run list --workflow ci.yml --commit "$COMMIT" --limit 20 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          test "$conclusion" -gt 0

      - name: Configure AWS access through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Start safe server deployment through SSM
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
          INSTANCE_ID: ${{ secrets.AWS_PRODUCTION_INSTANCE_ID }}
        run: |
          set -eu
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CookTale production deployment $COMMIT" \
            --parameters "commands=[\"set -eu; sudo -u ec2-user git -C /home/ec2-user/cooktale diff --quiet; sudo -u ec2-user git -C /home/ec2-user/cooktale diff --cached --quiet; sudo -u ec2-user git -C /home/ec2-user/cooktale fetch --prune origin main; sudo -u ec2-user git -C /home/ec2-user/cooktale cat-file -e $COMMIT^{commit}; sudo -u ec2-user git -C /home/ec2-user/cooktale merge-base --is-ancestor $COMMIT origin/main; deploy_script=\$(mktemp); sudo -u ec2-user git -C /home/ec2-user/cooktale show $COMMIT:deploy/deploy-production.sh > \$deploy_script; sh \$deploy_script $COMMIT; test \"\$(cat /home/ec2-user/cooktale/deploy/.state/current-deploy-commit)\" = \"$COMMIT\"; rm -f \$deploy_script\"]" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) \
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json
                exit 1 ;;
            esac
            echo "Waiting for the server deployment (attempt $attempt/60)..."
            sleep 10
          done

          echo "Deployment did not finish within 10 minutes. Check AWS Systems Manager."
          exit 1

      - name: Confirm the public Google callback page is live
        run: |
          set -eu
          callback_url="https://cooktale.in/auth/google/callback"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 6 --retry-all-errors --retry-delay 5 "$callback_url")"
          test "$status" = "200"

      - name: Confirm the public frontend is the approved build
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -eu
          homepage="$(curl --silent --show-error --fail --retry 6 --retry-all-errors --retry-delay 5 \
            "https://cooktale.in/?release-check=$COMMIT")"
          printf '%s' "$homepage" | grep -F "name=\"cooktale-build-revision\" content=\"$COMMIT\"" >/dev/null
          printf '%s' "$homepage" | grep -F 'name="google-adsense-account" content="ca-pub-4957518824200533"' >/dev/null

          ads_txt="$(curl --silent --show-error --fail --retry 6 --retry-all-errors --retry-delay 5 \
            "https://cooktale.in/ads.txt?release-check=$COMMIT")"
          printf '%s' "$ads_txt" | grep -Fx 'google.com, pub-4957518824200533, DIRECT, f08c47fec0942fa0' >/dev/null
