name: Reload production proxy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tested main commit containing the proxy fix.
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  reload:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm this commit is on main and passed CI
        id: release
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch origin main
          commit="$(git rev-parse "${REQUESTED_REF}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          test "$(gh run list --workflow ci.yml --commit "$commit" --limit 20 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')" -gt 0
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Configure AWS access through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Reload only Caddy through SSM
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
          INSTANCE_ID: ${{ secrets.AWS_PRODUCTION_INSTANCE_ID }}
        run: |
          set -eu
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CookTale production proxy reload $COMMIT" \
            --parameters "commands=[\"set -eu; sudo -u ec2-user git -C /home/ec2-user/cooktale diff --quiet; sudo -u ec2-user git -C /home/ec2-user/cooktale diff --cached --quiet; sudo -u ec2-user git -C /home/ec2-user/cooktale fetch --prune origin main; sudo -u ec2-user git -C /home/ec2-user/cooktale cat-file -e $COMMIT^{commit}; sudo -u ec2-user git -C /home/ec2-user/cooktale merge-base --is-ancestor $COMMIT origin/main; sudo -u ec2-user git -C /home/ec2-user/cooktale checkout --detach $COMMIT; docker compose --env-file /home/ec2-user/cooktale/.env.production -f /home/ec2-user/cooktale/docker-compose.production.yml up -d --force-recreate caddy\"]" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 24); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json
                exit 1 ;;
            esac
            sleep 5
          done
          exit 1

      - name: Confirm the public callback is live
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 6 --retry-all-errors --retry-delay 5 https://cooktale.in/auth/google/callback)"
          test "$status" = "200"
