services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: azamshaikh
      POSTGRES_PASSWORD: azamshaikh
      POSTGRES_DB: cooktale
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azamshaikh -d cooktale"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: cooktale_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cooktale_test
      POSTGRES_PASSWORD: cooktale_test
      POSTGRES_DB: cooktale_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cooktale_test -d cooktale_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      NODE_ENV: test
      APP_MODE: api
      PORT: 4001
      API_PREFIX: api
      API_VERSION: "1"
      DATABASE_URL: postgresql://cooktale_test:cooktale_test@postgres-test:5432/cooktale_test
      REDIS_URL: redis://redis-test:6379/0
      FRONTEND_URL: http://localhost:3001
      PUBLIC_API_URL: http://localhost:4001/api/v1
      CORS_ORIGINS: http://localhost:3001
      AUTH_TRUSTED_ORIGINS: http://localhost:3001
      AUTH_CSRF_PROTECTION_ENABLED: "true"
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters
      EMAIL_UNSUBSCRIBE_SECRET: test-email-unsubscribe-secret
      AUTH_RATE_LIMIT_ENABLED: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      APP_MODE: api
      PORT: 4000
      API_PREFIX: api
      API_VERSION: "1"
      DATABASE_URL: postgresql://azamshaikh:azamshaikh@postgres:5432/cooktale
      FRONTEND_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000/api/v1
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001,https://cooktale.in,https://www.cooktale.in,https://chef.cooktale.in,https://admin.cooktale.in,https://donate.cooktale.in
      JWT_ACCESS_SECRET: local-dev-access-secret-change-me
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-me
      REDIS_URL: redis://redis:6379
      CREATOR_PAYOUT_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GOOGLE_OAUTH_REDIRECT_URL: http://localhost:4000/api/v1/auth/google/callback
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    env_file:
      - ./backend/.env
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      APP_MODE: worker
      API_PREFIX: api
      API_VERSION: "1"
      DATABASE_URL: postgresql://azamshaikh:azamshaikh@postgres:5432/cooktale
      FRONTEND_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000/api/v1
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001,https://cooktale.in,https://www.cooktale.in,https://chef.cooktale.in,https://admin.cooktale.in,https://donate.cooktale.in
      JWT_ACCESS_SECRET: local-dev-access-secret-change-me
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-me
      REDIS_URL: redis://redis:6379
      CREATOR_PAYOUT_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GOOGLE_OAUTH_REDIRECT_URL: http://localhost:4000/api/v1/auth/google/callback
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://azamshaikh:azamshaikh@postgres:5432/cooktale
      SERVER_API_URL: http://backend:4000/api/v1
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-nextauth-secret-change-me
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      GOOGLE_CLIENT_ID: local-google-client-id
      GOOGLE_SECRET: local-google-secret
      LEMONSQUEEZY_API_KEY: local-lemonsqueezy-api-key
      LEMONSQUEEZY_STORE_ID: local-store-id
      LEMONSQUEEZY_VARIANT_MONTHLY: local-monthly-variant
      LEMONSQUEEZY_VARIANT_YEARLY: local-yearly-variant
      LEMONSQUEEZY_VARIANT_LIFETIME: local-lifetime-variant
      LEMONSQUEEZY_WEBHOOK_SECRET: local-webhook-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
